<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Djinny: Free Offline Trivia Game for Android</title>
    <meta
      name="description"
      content="Djinny is a free trivia game for Android with 6,000+ original questions, 23 categories, 5 game modes and a new puzzle every day. Play offline, no account needed."
    />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="color-scheme" content="dark light" />

    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />

    <!-- Google Play: lets the Play Store app open directly from this page on Android -->
    <meta name="google-play-app" content="app-id=%APP_ID%" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Djinny" />
    <meta property="og:title" content="Djinny: Free Offline Trivia Game for Android" />
    <meta
      property="og:description"
      content="6,000+ original questions, 5 game modes and a new puzzle every day. Play offline, no account needed."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/images/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Djinny, a free offline trivia game for Android" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Djinny: Free Offline Trivia Game for Android" />
    <meta name="twitter:description" content="6,000+ original questions, 5 game modes and a new puzzle every day." />
    <meta name="twitter:image" content="%SITE_URL%/images/og-image.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Djinny",
        "description": "A free trivia game with more than 6,000 original questions across 23 categories, five game modes, a daily challenge and a daily Quizzle. Works offline.",
        "applicationCategory": "GameApplication",
        "operatingSystem": "Android 7.0+",
        "url": "%SITE_URL%/",
        "downloadUrl": "%PLAY_URL%",
        "image": "%SITE_URL%/images/og-image.png",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <!-- Apply the saved theme before first paint. The app defaults to dark. -->
    <script>
      try {
        if (localStorage.getItem("djinny-theme") !== "light") document.documentElement.classList.add("dark");
      } catch (e) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 40rem; margin: 3rem auto; padding: 0 1rem; font-family: sans-serif; line-height: 1.6">
        <h1>Djinny: free offline trivia for Android</h1>
        <p>
          6,000+ original questions across 23 categories, five game modes (Survival, Sudden Death, Time Attack, True/False Blitz and
          Custom), a daily challenge and a daily Quizzle puzzle. No account needed.
        </p>
        <p><a href="%PLAY_URL%">Get it on Google Play</a> · <a href="./privacy/">Privacy policy</a></p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
